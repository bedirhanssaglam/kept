name: kept_flutter
description: A new Flutter project with Serverpod.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.5
  cupertino_native: ^0.1.1
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.1.0
  kept_client:
    path: ../kept_client
  serverpod_auth_idp_flutter: 4.0.3
  serverpod_flutter: 4.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config.json
    - assets/translations/
    - assets/images/
